[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-productivity-command-center"
version = "0.1.0"
description = "Local-first multi-provider AI productivity planning CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["python-dotenv>=1.0.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
